name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, nightly ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IC_KEYSTORE_BASE64: ${{ secrets.IC_KEYSTORE_BASE64 }}
      IC_STORE_PASSWORD: ${{ secrets.IC_STORE_PASSWORD }}
      IC_KEY_ALIAS: ${{ secrets.IC_KEY_ALIAS }}
      IC_KEY_PASSWORD: ${{ secrets.IC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 still runs `sdkmanager tools`, and
      # that package no longer exists (the action dies before installing
      # anything). The ubuntu runner already ships cmdline-tools, so use its
      # sdkmanager directly.
      - name: Install SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      # Optional: set the four repository secrets (IC_KEYSTORE_BASE64 =
      # base64 of a .jks, plus store password, key alias and key password)
      # to get a properly signed release APK. Without them the release
      # artifact falls back to debug signing.
      - name: Decode signing keystore
        if: env.IC_KEYSTORE_BASE64 != ''
        run: echo "$IC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ic.keystore"

      - name: Test and build APKs
        working-directory: apk-gradle
        run: |
          KEYSTORE_ARGS=""
          if [ -n "$IC_KEYSTORE_BASE64" ]; then
            KEYSTORE_ARGS="-Pic.keystore=$RUNNER_TEMP/ic.keystore -Pic.storePassword=$IC_STORE_PASSWORD -Pic.keyAlias=$IC_KEY_ALIAS -Pic.keyPassword=$IC_KEY_PASSWORD"
          fi
          ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --no-daemon $KEYSTORE_ARGS

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ic-timer-lpe-apk
          path: |
            apk-gradle/app/build/outputs/apk/release/*.apk
            apk-gradle/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
