name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: apk-gradle
        run: |
          # gradlew has no exec bit in the repo (committed from Windows),
          # and the local aapt2 override only exists on author machines.
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Stage APK
        run: |
          cp apk-gradle/app/build/outputs/apk/debug/app-debug.apk \
             "ic-timerlpe-${GITHUB_REF_NAME}-debug.apk"
          ls -l ic-timerlpe-*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ic-timerlpe-*-debug.apk
          generate_release_notes: true
          body: |
            TimerRoot — POSIX CPU-timer UAF (CVE-2026-98260) → fake cred →
            KernelSU late-load ("Jailbreak mode").

            **This build is debug-signed.** Requires a running Shizuku shell
            service (ADB / wireless debugging). One full run per boot — the
            app enforces this itself; reboot before every run.
