name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      IC_KEYSTORE_BASE64: ${{ secrets.IC_KEYSTORE_BASE64 }}
      IC_STORE_PASSWORD: ${{ secrets.IC_STORE_PASSWORD }}
      IC_KEY_ALIAS: ${{ secrets.IC_KEY_ALIAS }}
      IC_KEY_PASSWORD: ${{ secrets.IC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The four repository secrets (IC_KEYSTORE_BASE64 = base64 of a .jks,
      # plus store password, key alias and key password) are REQUIRED:
      # publishing a debug-signed release APK would break the in-app
      # updater's signature check, so the run refuses to continue when
      # they are missing (fail-closed).
      - name: Refuse to publish without the signing secrets
        if: env.IC_KEYSTORE_BASE64 == ''
        run: |
          echo "::error::IC_KEYSTORE_BASE64 (and companions) are not set - refusing to publish a debug-signed release."
          exit 1
      - name: Decode signing keystore
        if: env.IC_KEYSTORE_BASE64 != ''
        run: echo "$IC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ic.keystore"
      - name: Test and build release APK
        working-directory: apk-gradle
        run: |
          KEYSTORE_ARGS=""
          if [ -n "$IC_KEYSTORE_BASE64" ]; then
            KEYSTORE_ARGS="-Pic.keystore=$RUNNER_TEMP/ic.keystore -Pic.storePassword=$IC_STORE_PASSWORD -Pic.keyAlias=$IC_KEY_ALIAS -Pic.keyPassword=$IC_KEY_PASSWORD"
          fi
          # testDebugUnitTest runs first; a failing test aborts the job
          # before anything is staged or published.
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon $KEYSTORE_ARGS
      - name: Stage APK
        run: |
          APK="apk-gradle/app/build/outputs/apk/release/app-release.apk"
          [ -f "$APK" ] || APK="apk-gradle/app/build/outputs/apk/release/app-release-unsigned.apk"
          cp "$APK" "TimerRoot-${GITHUB_REF_NAME}.apk"
          ls -l TimerRoot-*.apk
      - name: Prerelease flag from the tag shape
        id: relflag
        run: echo "prerelease=$(echo "$GITHUB_REF_NAME" | awk -F. 'NF>=3 {print "true"}')" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: TimerRoot-*.apk
          generate_release_notes: true
          prerelease: ${{ steps.relflag.outputs.prerelease == 'true' }}
          body: |
            ## What's new

            (This section is edited in after publishing.)

            ## About TimerRoot

            TimerRoot — POSIX CPU-timer UAF (CVE-2026-98260) → fake cred →
            KernelSU late-load ("Jailbreak mode").

            Signed with the release keystore; the workflow refuses to
            publish without it. Requires a running Shizuku shell
            service (ADB / wireless debugging). One full run per boot — the
            app enforces this itself; reboot before every run.
